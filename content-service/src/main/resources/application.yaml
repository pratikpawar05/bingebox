spring:
  application:
    name: content-service
  datasource:
    url: jdbc:postgres://localhost:5432/bingebox
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect


server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info